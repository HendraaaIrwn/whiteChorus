name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: white_chorus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/white_chorus_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/white_chorus_test
      SESSION_TOKEN_SECRET: ci-session-secret-at-least-thirty-two-characters
      RATE_LIMIT_SECRET: ci-rate-limit-secret-at-least-thirty-two-characters
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-only-placeholder
      CRON_SECRET: ci-cron-secret-at-least-thirty-two-characters
      INTERNAL_ADMIN_SECRET: ci-admin-secret-at-least-thirty-two-characters
      TURNSTILE_MODE: off
      NEXT_PUBLIC_ASSET_MODE: fixture
      RUN_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm env:validate
      - run: pnpm prisma:validate
      - name: Assert migration target starts empty
        run: pnpm db:assert-empty
      - run: pnpm prisma:deploy
      - name: Generate fixture dress-up assets
        if: env.NEXT_PUBLIC_ASSET_MODE == 'fixture'
        run: pnpm assets:generate:fixture
      - run: pnpm assets:validate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Run unit tests
        run: RUN_DATABASE_TESTS=0 pnpm test
      - name: Run PostgreSQL integration tests
        run: pnpm test:postgres
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Seed Hall of Fame looks for E2E
        run: SEED_OUTFIT_COUNT=14 SEED_INELIGIBLE=1 SEED_SKIP_DAILY_WINNER=1 pnpm prisma:seed
      - run: pnpm test:e2e

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
